# Deployment Configuration
# Hangman CLI v1.0.0

[staging]
environment = local
install_method = wheel
verify_tests = true

[production]
environment = pypi
publish = true
verify_install = true

[artifacts]
wheel = dist/hangman-1.0.0-py3-none-any.whl
sdist = dist/hangman-1.0.0.tar.gz

[verification]
test_command = pytest tests/ -v
smoke_test = hangman --help
import_check = import hangman
